<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chandler, drawn by its people</title>
<meta name="description" content="Chandler, Arizona, from 1970 to today as a relief map: colour and shading show how densely each part of the city is settled.">
<style>
/* Layout: story column on the left, the relief map filling the right column (sized to the
   city's shape), one control bar along the bottom. Colours and type follow the
   school-atlas reference: black ground, white ink, one dark climate only. */
:root{
  --plane:#1d1e1c; --surface:#0c0c0c; --ink:#fff; --ink2:#bfbeb6; --muted:#7f7d77;
  --line:#232321; --axis:#33332f; --ring:rgba(255,255,255,.09); --accent:#9aa07f;
  --u:min(1vh,.62vw);      /* panel scale unit: grows with the screen */
  --map-w:62vw;            /* set by the script to the map's natural width */
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--plane);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;overflow:hidden}
#app{height:100%;display:grid;
  grid-template-columns:minmax(320px,1fr) minmax(0,var(--map-w));
  grid-template-rows:minmax(0,1fr) auto;
  grid-template-areas:"panel map" "controls controls";
  padding-inline:clamp(16px,2.5vw,44px);padding-block:clamp(10px,1.6vh,28px) 0;
  column-gap:clamp(16px,2.5vw,56px)}

/* ---------- story panel */
#panel{grid-area:panel;min-width:0;min-height:0;display:flex;flex-direction:column;
  gap:calc(1.5*var(--u));justify-content:space-between;overflow:hidden}
.eyebrow{font:600 max(12px,calc(1.6*var(--u)))/1.2 system-ui,sans-serif;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#demo{font-weight:500;letter-spacing:.02em;text-transform:none;color:#e0ad5f;
  border:1px solid rgba(224,173,95,.5);border-radius:4px;padding:2px 7px}
.headline{display:flex;align-items:baseline;gap:.35em;flex-wrap:wrap}
#year{font-weight:650;font-size:max(72px,calc(16*var(--u)));line-height:.85;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.popblock{display:flex;flex-direction:column;gap:4px}
#pop{font-weight:650;font-size:max(22px,calc(4.4*var(--u)));line-height:1;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums}
.popline{font-size:max(13px,calc(1.8*var(--u)));line-height:1.2;color:var(--ink2);display:flex;gap:8px;align-items:center}
#popKind{font-size:max(11px,calc(1.45*var(--u)));line-height:1;padding:.3em .55em;border-radius:5px;
  border:1px solid var(--axis);color:var(--ink2)}
#popKind.census{color:var(--ink);border-color:var(--muted)}

#story{display:flex;flex-direction:column;gap:calc(.7*var(--u));max-width:36em;transition:opacity .4s}
#chRange{font-size:max(13px,calc(1.8*var(--u)));line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
#chTitle{margin:0;font-weight:650;font-size:max(20px,calc(3.4*var(--u)));line-height:1.15;text-wrap:balance}
#chText{margin:0;color:var(--ink2);font-size:max(14px,calc(2.1*var(--u)));line-height:1.45}

#chList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
#chList button{all:unset;cursor:pointer;display:grid;grid-template-columns:6.5em 1fr;gap:10px;
  padding:calc(.2*var(--u)) 0;font-weight:600;font-size:max(12.5px,calc(1.75*var(--u)));line-height:1.3;
  color:var(--muted);border-radius:2px}
#chList .range{font-weight:400;font-variant-numeric:tabular-nums}
#chList li.past button{color:var(--ink2)}
#chList li.active button{color:var(--ink)}
#chList li.active .range{color:var(--accent)}
#chList button:hover{color:var(--ink)}
#chList button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.cap{font-weight:600;font-size:max(11px,calc(1.5*var(--u)));line-height:1.2;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted)}
.sparkwrap{display:flex;flex-direction:column;gap:4px}
#spark{width:100%;height:max(64px,calc(11*var(--u)));display:block}

/* ---------- legend (reference style: words at the ends, numbers on the ladder) */
.legende{font-size:max(12px,calc(1.7*var(--u)));color:var(--ink2);font-variant-numeric:tabular-nums}
.pole{display:flex;justify-content:space-between;align-items:center;color:var(--muted);margin-bottom:4px;line-height:1.2}
.pole .rechts{display:flex;align-items:center;gap:8px}
.rampe{height:max(10px,calc(1.8*var(--u)));border-radius:5px;border:1px solid var(--ring)}
.stufen{position:relative;height:1.3em;margin-top:4px}
.stufen span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.stufen span::before{content:'';position:absolute;left:50%;top:-4px;width:1px;height:4px;background:var(--axis)}
.stufen .a{transform:none}
.stufen .a::before{left:0}
.stufen .eins{color:var(--ink)}
.stufen .eins::before{top:-7px;height:7px;background:var(--ink)}
.klein{margin:4px 0 0;font-size:max(12px,calc(1.7*var(--u)));line-height:1.35;color:var(--ink2)}
.quelle{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0 0;font-size:max(10.5px,calc(1.3*var(--u)));line-height:1.35;color:var(--muted)}
#farben{padding:2px 7px;font-size:max(11px,calc(1.4*var(--u)));line-height:1.2;border-radius:6px;color:var(--muted);border-style:dashed}
#farben[aria-pressed=true]{color:var(--ink);border-style:solid}

/* ---------- map */
#mapwrap{grid-area:map;position:relative;min-width:0;min-height:0}
#karte,#umriss{position:absolute;pointer-events:none}   /* sized by the script: larger than the column so the shadow can fade out */
#umriss{z-index:2}
#mapwrap{z-index:0}
#panel,#controls{position:relative;z-index:1}
.tip{position:absolute;z-index:4;pointer-events:none;background:#141412;border:1px solid var(--axis);
  border-radius:9px;padding:7px 9px;font-size:12.5px;box-shadow:0 6px 25px rgba(0,0,0,.5);
  max-width:280px;opacity:0;transition:opacity .15s}
.tip b{display:block;font-size:13px;margin-bottom:2px}
.tip dl{margin:0;display:grid;grid-template-columns:auto auto;gap:1px 10px}
.tip dt{color:var(--ink2)}
.tip dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.tip .sub{display:block;margin-top:5px;padding-top:4px;border-top:1px solid var(--axis);color:var(--muted);font-size:11.5px}

/* ---------- controls */
#controls{grid-area:controls;display:flex;align-items:center;gap:14px;
  padding-block:6px calc(8px + env(safe-area-inset-bottom,0px));transition:opacity .6s ease}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--axis);
  border-radius:8px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{height:36px;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
#play{min-width:92px;justify-content:center}
.track{position:relative;flex:1;min-width:120px;padding-bottom:16px}
#scrub{width:100%;margin:0;accent-color:var(--accent)}
#ticks{position:absolute;left:7px;right:7px;bottom:0;height:14px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
#ticks span{position:absolute;transform:translateX(-50%)}
select{height:36px;border-radius:8px;background:var(--surface);color:var(--ink);border:1px solid var(--axis);font:500 13px system-ui,sans-serif;padding:0 8px}
#namen[aria-pressed=false]{color:var(--muted);border-style:dashed}
.keys{font-size:11px;color:var(--muted);white-space:nowrap}
body.idle #controls{opacity:0}
body.idle{cursor:none}
body.kiosk #controls{display:none}
body.kiosk #app{padding-bottom:clamp(10px,1.6vh,28px)}

@media (max-aspect-ratio:5/4),(max-width:820px){
  body{overflow:auto}
  #app{height:auto;min-height:100%;grid-template-columns:minmax(0,1fr);
    grid-template-rows:auto minmax(60vh,1fr) auto;grid-template-areas:"panel" "map" "controls";row-gap:12px}
  #panel{overflow:visible}
  #chList,.keys{display:none}
}
@media (max-width:520px){#controls{flex-wrap:wrap}.track{order:-1;flex-basis:100%}}
@media (prefers-reduced-motion:reduce){#story,#controls{transition:none}}
</style>
</head><body>
<div id="app">
  <section id="panel" aria-label="Story">
    <div class="eyebrow"><span id="place">Chandler, AZ</span><span>Population density</span></div>
    <div class="headline" aria-live="polite">
      <div id="year">1970</div>
      <div class="popblock">
        <div id="pop">13,763</div>
        <div class="popline"><span>people</span><span id="popKind">Census</span></div>
      </div>
    </div>
    <div id="story">
      <div id="chRange"></div>
      <h1 id="chTitle"></h1>
      <p id="chText"></p>
    </div>
    <ol id="chList" aria-label="Chapters"></ol>
    <div class="sparkwrap">
      <div class="cap">Residents</div>
      <canvas id="spark" aria-hidden="true"></canvas>
    </div>
    <div>
      <div class="legende"><div class="pole"><span>less crowded</span><span class="rechts"><span>more crowded</span><button id="farben" aria-pressed="false" title="Colours for red-green colour blindness">Colours</button></span></div><div class="rampe" id="rampe"></div><div class="stufen" id="legStufen"></div></div>
      <p class="klein" id="legText"></p>
      <p class="quelle" id="quelle"></p>
    </div>
  </section>

  <div id="mapwrap">
    <canvas id="karte" role="img" aria-label="Relief map of Chandler's population density for the year shown"></canvas>
    <canvas id="umriss" aria-hidden="true"></canvas>
    <div class="tip" id="tip"></div>
  </div>

  <div id="controls">
    <button id="play" class="btn" type="button" aria-label="Pause">❚❚ <span class="lbl">Pause</span></button>
    <div class="track">
      <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Year">
      <div id="ticks" aria-hidden="true"></div>
    </div>
    <select id="speed" aria-label="Playback speed">
      <option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
    </select>
    <button id="namen" class="btn" type="button" aria-pressed="true">Names</button>
    <button id="fullscreen" class="btn" type="button">Full screen</button>
    <span class="keys">Space play · ← → year · 1–5 chapter · H hide</span>
  </div>
</div>

<!-- Real data from pipeline/build_density_frames.py. If it is missing, demo.js draws a simulated pattern. -->
<script src="data/density-data.js"></script>
<script src="demo.js"></script>
<script>
(function () {
'use strict';
/* ======================= settings you may want to change ======================= */
// Where the white "snow" starts, as a multiple of the reference average.
// 'auto' sets it so that WHITE_SHARE of the city is white in the final year.
const WHITE_AT = 3.0;         // a number (no quotes) fixes it; 'auto' sets it from the data
const WHITE_SHARE = 0.05;
const SEC_PER_YEAR = 0.8;        // playback speed
const END_HOLD = 4.5;              // seconds the last year stays before the loop restarts

/* ======================= data ======================= */
function loadData() {
  const src = window.DENSITY_DATA;
  if (!src) return window.makeDemoData();
  const d = Object.assign({}, src);
  if (typeof d.frames === 'string') {
    const bin = atob(d.frames), n = d.width * d.height, bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const dv = new DataView(bytes.buffer), frames = [];
    for (let f = 0; f < d.years.length; f++) {
      const a = new Float32Array(n), off = f * n * 2;
      for (let c = 0; c < n; c++) a[c] = dv.getUint16(off + c * 2, true) / d.scale;
      frames.push(a);
    }
    d.frames = frames;
  }
  return d;
}
const D = loadData();
const W = D.width, H = D.height, N = W * H;
const YEARS = D.years, NF = YEARS.length, Y0 = YEARS[0], Y1 = YEARS[NF - 1];
const CENSUS = new Set(D.censusYears || []);
/* Extra smoothing: a small Gaussian over the density grid rounds off the corners
   of every band. SMOOTH is in grid cells (100 m); 0 turns it off. */
const SMOOTH = 1.6;
const SM_K = (() => {
  if (!(SMOOTH > 0)) return null;
  const r = Math.ceil(SMOOTH * 2.5), k = []; let s = 0;
  for (let i = -r; i <= r; i++) { const v = Math.exp(-i * i / (2 * SMOOTH * SMOOTH)); k.push(v); s += v; }
  return k.map(v => v / s);
})();
const SM_TMP = new Float32Array(N);
const POP = YEARS.map(y => +(D.population[y] || D.population[String(y)] || 0));
const PLACE = (D.place || 'Chandler, AZ').split(',')[0];

// grid cells inside the city outline
const INSIDE = new Uint8Array(N);
for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
  const x = i + 0.5, y = j + 0.5; let c = false;
  for (const r of D.boundary) for (let a = 0, b = r.length - 1; a < r.length; b = a++) {
    const [xa, ya] = r[a], [xb, yb] = r[b];
    if ((ya > y) !== (yb > y) && x < (xb - xa) * (y - ya) / (yb - ya) + xa) c = !c;
  }
  INSIDE[j * W + i] = c ? 1 : 0;
}
/* Edge correction. The density grids were smoothed with nothing outside the
   city, so every value near the city limits is diluted by empty land and the map
   would sink into a blue rim at its edge. Dividing by the smoothed city mask (a
   normalized convolution) keeps edge neighbourhoods at their real level; cells just
   outside take the value of the nearest cell inside, so no contour piles up on the
   boundary. */
const EDGE_SIGMA = 4.5;          // the pipeline's BANDWIDTH_M / CELL_M
const NORM = (() => {
  const r = Math.ceil(EDGE_SIGMA * 3), k = [];
  let s = 0; for (let i = -r; i <= r; i++) { const v = Math.exp(-i * i / (2 * EDGE_SIGMA * EDGE_SIGMA)); k.push(v); s += v; }
  for (let i = 0; i < k.length; i++) k[i] /= s;
  const tmp = new Float32Array(N), out = new Float32Array(N);
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    let v = 0; for (let q = -r; q <= r; q++) { const x = i + q; if (x >= 0 && x < W) v += INSIDE[j * W + x] * k[q + r]; }
    tmp[j * W + i] = v;
  }
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    let v = 0; for (let q = -r; q <= r; q++) { const y = j + q; if (y >= 0 && y < H) v += tmp[y * W + i] * k[q + r]; }
    out[j * W + i] = Math.max(0.35, v);
  }
  return out;
})();
const SOURCE_CELL = (() => {      // nearest inside cell for every cell (itself if inside)
  const src = new Int32Array(N).fill(-1); let front = [];
  for (let c = 0; c < N; c++) if (INSIDE[c]) { src[c] = c; front.push(c); }
  for (let step = 0; step < 6 && front.length; step++) {
    const next = [];
    for (const c of front) {
      const i = c % W, j = (c / W) | 0;
      for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const x = i + di, y = j + dj; if (x < 0 || y < 0 || x >= W || y >= H) continue;
        const n = y * W + x; if (src[n] < 0) { src[n] = src[c]; next.push(n); }
      }
    }
    front = next;
  }
  return src;
})();
const corrected = (A, c) => { const s = SOURCE_CELL[c]; return s < 0 ? 0 : A[s] / NORM[s]; };

let BX0 = Infinity, BX1 = -Infinity, BY0 = Infinity, BY1 = -Infinity;
for (const r of D.boundary) for (const [x, y] of r) {
  BX0 = Math.min(BX0, x); BX1 = Math.max(BX1, x); BY0 = Math.min(BY0, y); BY1 = Math.max(BY1, y);
}
const ASPECT = (BX1 - BX0) / (BY1 - BY0);

/* ======================= the colour ladder =======================
   25 bands, a school-atlas convention: five of water where the fewest people
   live, then forest green, grass, yellow, ochre, orange, red, and snow at the top.
   The coast sits at x0.5 of the average, white starts at WHITE. */
const HYPSO_ATLAS = ["#082c5d","#134377","#1f5b92","#2c74ac","#398ec7","#00621b","#006e1c","#007a1d","#00871d","#019419","#11a10a","#2fac14","#4ab71e","#70c12b","#8fcc37","#b5d33f","#dbd943","#eacf3b","#efbb2f","#f09f23","#e87e1d","#dd5a1a","#d13819","#f2ebe6","#ffffff"];
const HYPSO_CVD = ["#082c5d","#0e3764","#14426c","#1a4c74","#20577d","#8d481c","#955020","#9c5825","#a4612a","#ac692f","#b37134","#bb7a3a","#c2833f","#ca8b45","#d0944d","#d59d56","#daa660","#dfaf6a","#e4b774","#e7c183","#e8ca96","#ead3a8","#eddcba","#f2ebe6","#ffffff"];
const NB = 25, WATER = 5, SNOW = 23;
let HYPSO, HR, HG, HB, WALL, WALLFOOT;
function setLadder(list) {
  HYPSO = list;
  HR = list.map(h => parseInt(h.slice(1, 3), 16));
  HG = list.map(h => parseInt(h.slice(3, 5), 16));
  HB = list.map(h => parseInt(h.slice(5, 7), 16));
  WALL = list.map((h, i) => `rgb(${HR[i] * .8 | 0},${HG[i] * .8 | 0},${HB[i] * .8 | 0})`);
  WALLFOOT = list.map((h, i) => `rgb(${HR[i] * .55 | 0},${HG[i] * .55 | 0},${HB[i] * .55 | 0})`);
}
setLadder(HYPSO_ATLAS);

const WHITE = (() => {
  if (typeof WHITE_AT === 'number') return WHITE_AT;
  const last = D.frames[NF - 1], tmp = new Float32Array(N), v = [];
  for (let c = 0; c < N; c++) tmp[c] = corrected(last, c);
  smoothField(tmp);
  for (let c = 0; c < N; c++) if (INSIDE[c]) v.push(tmp[c]);
  v.sort((a, b) => a - b);
  const q = v[Math.floor(v.length * (1 - WHITE_SHARE))] || 2.5;
  return Math.min(3.5, Math.max(1.5, Math.round(q * 10) / 10));
})();
// density ratio -> position on the ladder, 0..1 (band = floor(f * 25))
function ladder(h) {
  if (!(h > 0)) return 0;
  if (h <= 0.5) return (h / 0.5) * WATER / NB;
  if (h <= WHITE) return (WATER + (h - 0.5) / (WHITE - 0.5) * (SNOW - WATER)) / NB;
  return (SNOW + 2 * (1 - Math.exp(-(h - WHITE) / (0.25 * WHITE)))) / NB;   // a knee, never a lid
}
const band = f => f <= 0 ? 0 : f >= 1 ? NB - 1 : Math.min(NB - 1, Math.floor(f * NB));

/* ======================= time ======================= */
let t = 0;                       // position in frames, fractional
let playing = !matchMedia('(prefers-reduced-motion: reduce)').matches;
let hold = 1.0, lastTs = 0;
const yearAt = tt => Y0 + (Y1 - Y0) * tt / (NF - 1);

/* ======================= field for the current moment ======================= */
const RAW = new Float32Array(N), F = new Float32Array(N);   // ratio, ladder position
function fieldAt(tt) {
  const i = Math.min(NF - 1, Math.floor(tt)), j = Math.min(NF - 1, i + 1);
  let u = tt - i; u = u * u * (3 - 2 * u);
  const A = D.frames[i], B = D.frames[j];
  for (let c = 0; c < N; c++) {
    const a = corrected(A, c), v = a + (corrected(B, c) - a) * u;
    RAW[c] = v;
  }
  smoothField(RAW);
  for (let c = 0; c < N; c++) F[c] = ladder(RAW[c]);
}
function smoothField(A) {
  if (!SM_K) return;
  const r = (SM_K.length - 1) / 2;
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    let v = 0;
    for (let q = -r; q <= r; q++) { const x = Math.min(W - 1, Math.max(0, i + q)); v += A[j * W + x] * SM_K[q + r]; }
    SM_TMP[j * W + i] = v;
  }
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    let v = 0;
    for (let q = -r; q <= r; q++) { const y = Math.min(H - 1, Math.max(0, j + q)); v += SM_TMP[y * W + i] * SM_K[q + r]; }
    A[j * W + i] = v;
  }
}

/* ======================= canvas and fit ======================= */
const cv = document.getElementById('karte'), ctx = cv.getContext('2d');
let breite = 0, hoehe = 0, DPR = 1, mass = 1, verX = 0, verY = 0;
function fitColumns() {
  // the map column is as wide as the city needs at full height; the story panel gets the rest
  const mapH = cv.parentElement.getBoundingClientRect().height || innerHeight * 0.85;
  const w = Math.min(mapH * ASPECT * 1.03 + mapH * 0.02, innerWidth * 0.68);
  document.documentElement.style.setProperty('--map-w', Math.round(w) + 'px');
}
let BLEED = 0, MAPW = 0, MAPH = 0, HALO = 24;
const uv = document.getElementById('umriss'), uctx = uv.getContext('2d');
function masse() {
  const feld = cv.parentElement;
  MAPW = feld.clientWidth; MAPH = Math.max(120, feld.clientHeight);
  // the canvas reaches past the map column on every side, so the soft shadow can fade out fully
  HALO = Math.max(20, MAPH * 0.05);
  BLEED = Math.round(HALO * 1.6);
  breite = MAPW + 2 * BLEED; hoehe = MAPH + 2 * BLEED;
  DPR = Math.min(2, devicePixelRatio || 1);
  for (const c of [cv, uv]) {
    c.style.left = c.style.top = -BLEED + 'px';

/* ======================= the relief raster =======================

let RU = 2, RW = 0, RH = 0, rc = null, rctx = null, rimg = null, RV = null, HT = null, SH = null, LIT = null;

  rctx = rc.getContext('2d'); rimg = rctx.createImageData(RW, RH);

    for (let x = 0; x < RW; x++) {
      const gx = Math.min(W - 1.001, Math.max(0, (x + 0.5) / RU - 0.5)), i = gx | 0, fx = gx - i, c = j * W + i;

    }

  const ABFALL = Math.SQRT2 * Math.tan(Math.PI * LOWSUN / 180) / OVER;

    let x = k < RW ? k : 0, y = k < RW ? 0 : k - RW + 1, s = -1;
    while (x < RW && y < RH) {

      const gx = (RV[zc + xp] - RV[zc + xm]) * 0.5 * OVER, gy = (RV[zu + x] - RV[zo + x]) * 0.5 * OVER;

        const grad = Math.hypot(RV[zc + xp] - RV[zc + xm], RV[zu + x] - RV[zo + x]) * 0.5 * NB;

/* ======================= contour lines (Tanaka) =======================
   One line on every band edge. Facing the light it is white, facing away it is
   dark, so each terrace looks embossed. Higher bands get heavier lines. */
const LINE = 0.72, DARKLINE = 0.85;
function contours(zc, toScreen, strich, alphaScale) {
  const lit = [], dark = [];
  for (let k = 1; k < NB; k++) { lit.push([]); dark.push([]); }
  for (let j = 0; j < H - 1; j++) for (let i = 0; i < W - 1; i++) {
    const c = j * W + i;
    const a = F[c], b = F[c + 1], cc = F[c + W + 1], d = F[c + W];
    const lo = Math.min(a, b, cc, d), hi = Math.max(a, b, cc, d);
    const k0 = Math.max(1, Math.floor(lo * NB) + 1), k1 = Math.min(NB - 1, Math.floor(hi * NB));
    if (k1 < k0) continue;
    // uphill direction in this cell; light comes from the upper left
    const gx = (b - a + cc - d), gy = (d - a + cc - b), facing = gx + gy > 0;
    for (let k = k0; k <= k1; k++) {
      const lv = k / NB;
      const x = i + 0.5, y = j + 0.5, p = [];
      const e = (v1, v2) => (lv - v1) / (v2 - v1);
      if ((a >= lv) !== (b >= lv)) p.push(x + e(a, b), y);
      if ((b >= lv) !== (cc >= lv)) p.push(x + 1, y + e(b, cc));
      if ((d >= lv) !== (cc >= lv)) p.push(x + e(d, cc), y + 1);
      if ((a >= lv) !== (d >= lv)) p.push(x, y + e(a, d));
      if (p.length >= 4) (facing ? lit : dark)[k - 1].push(p);

      if (!list.length) continue;

        let [X, Y] = toScreen(p[0], p[1], k); zc.moveTo(X, Y);
        [X, Y] = toScreen(p[2], p[3], k); zc.lineTo(X, Y);
        if (p.length === 8) {

          [X, Y] = toScreen(p[6], p[7], k); zc.lineTo(X, Y);

      zc.globalAlpha = Math.min(1, LINE * st * al * alphaScale + 0.08);

}

/* ======================= outline paths ======================= */
/* The city limits follow section lines and parcel edges, so they are full of small
   steps and sharp corners. For drawing, the outline is first simplified (tiny jogs
   disappear) and then every corner is rounded with a curve of a fixed size, so long
   straight edges stay straight. BOUNDARY_SIMPLIFY and BOUNDARY_ROUND are in grid cells
   (100 m); set BOUNDARY_ROUND to 0 for the original sharp corners. */
const BOUNDARY_SIMPLIFY = 0.6, BOUNDARY_ROUND = 3;

      if (d > dm) { dm = d; k = i; }
    }
    if (dm <= tol) return [pts[0], pts[pts.length - 1]];
    return dp(pts.slice(0, k + 1), tol).slice(0, -1).concat(dp(pts.slice(k), tol));
  };
  return D.boundary.map(r0 => {
    let r = r0.slice();
    if (r.length > 1 && r[0][0] === r[r.length - 1][0] && r[0][1] === r[r.length - 1][1]) r.pop();
    if (BOUNDARY_SIMPLIFY > 0 && r.length > 8) {
      // split the closed ring in two so the simplifier keeps both halves
      const h = r.length >> 1;
      const s = dp(r.slice(0, h + 1), BOUNDARY_SIMPLIFY).slice(0, -1).concat(dp(r.slice(h).concat([r[0]]), BOUNDARY_SIMPLIFY).slice(0, -1));
      if (s.length >= 4) r = s;
    }
    if (!(BOUNDARY_ROUND > 0)) return r;

    // join the two cut points with a quadratic curve through the old corner
    const out = [], n = r.length, STEPS = 8;

      const [px, py] = r[(i - 1 + n) % n], [cx, cy] = r[i], [nx, ny] = r[(i + 1) % n];
      const l1 = Math.hypot(cx - px, cy - py), l2 = Math.hypot(nx - cx, ny - cy);
      if (l1 < 1e-9 || l2 < 1e-9) { out.push([cx, cy]); continue; }

  });

  const p = new Path2D();

/* ======================= drawing ======================= */
let dirty = true, NAMES = true;
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  if (!rc) return;
  renderRaster();
  const map = (x, y) => [x * mass + verX, y * mass + verY];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sil = outlinePath(map);
  // soft dark halo around the whole city, slightly offset down-right (as in the classic page)
  const blur = HALO;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = blur * DPR;
  ctx.shadowOffsetX = blur * 0.15 * DPR; ctx.shadowOffsetY = blur * 0.25 * DPR;
  ctx.fillStyle = '#000';
  ctx.fill(sil, 'evenodd'); ctx.fill(sil, 'evenodd');
  ctx.shadowBlur = blur * 0.3 * DPR; ctx.fill(sil, 'evenodd');
  ctx.restore();
  // the map lies on the table like a sheet: a soft shadow, a dark edge, then the terrain
  const depth = Math.max(2.5, breite / 130);
  ctx.save(); ctx.translate(0, depth * 1.9); ctx.filter = `blur(${(depth * 1.2).toFixed(1)}px)`;
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fill(sil); ctx.restore();

  if (SHOW_OVERLAYS) drawOverlays(map);
  ctx.restore();

/* ======================= overlays: freeways, ramps and runways =======================
   Soft, see-through layers on top of the terrain so they read as landmarks, not data.
   Loop 202, Loop 101 and I-10 share one style; ramps use the same style, thinner. The
   network is drawn fully opaque on its own layer and then laid over the map at one
   transparency, so crossings and ramp junctions don't show darker overlaps. Everything is
   clipped to the city outline. */

const OV = D.overlays || { freeway: [], ramps: [], runways: [] };
let ovCanvas = null, ovCtx = null;
function drawOverlays(map) {
  const line = (pts) => { const p = new Path2D(); pts.forEach(([x, y], k) => { const [X, Y] = map(x, y); k ? p.lineTo(X, Y) : p.moveTo(X, Y); }); return p; };

    if (!ovCanvas || ovCanvas.width !== cv.width || ovCanvas.height !== cv.height) {
      ovCanvas = document.createElement('canvas'); ovCanvas.width = cv.width; ovCanvas.height = cv.height; ovCtx = ovCanvas.getContext('2d');
    }
    const o = ovCtx;
    o.setTransform(1, 0, 0, 1, 0, 0); o.clearRect(0, 0, ovCanvas.width, ovCanvas.height);
    o.setTransform(DPR, 0, 0, DPR, 0, 0);

    const wr = Math.max(1.4, w * 0.42);                        // ramps

/* names: white with a dark halo and a red dot on the place, set a little below the peak.
   Two-line labels: put a "|" where the line should break, e.g. 'Chandler|Fashion Center'.
   Add a name here to change how it is written on the map without rerunning the Python script. */

  'Chandler Fashion Center': 'Chandler|Fashion Center',
  'Southeast Chandler': 'Southeast|Chandler',
  'Chandler Airport': 'Chandler|Airport',

function drawNames() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const placed = [];
  for (const lb of [...D.labels].sort((a, b) => a.rank - b.rank)) {
    const ox = lb.x * mass + verX, oy = lb.y * mass + verY;
    const size = Math.max(11, Math.min(34, mass * (lb.rank === 1 ? 3.6 : lb.rank === 2 ? 3.0 : 2.6)));
    ctx.font = '600 ' + size.toFixed(1) + 'px system-ui,-apple-system,"Segoe UI",sans-serif';
    const lines = (LABEL_TEXT[lb.name] || lb.name).split(/\||\n/).map(s => s.trim());
    const lh = size * 1.1;                                  // line height
    const w = Math.max(...lines.map(l => ctx.measureText(l).width));
    const x = Math.max(w / 2 + 2, Math.min(breite - w / 2 - 2, ox));
    const y0 = oy + size * 0.95;                            // first line sits just below the dot
    const box = [x - w / 2 - 4, y0 - size / 2 - 3, x + w / 2 + 4, y0 + (lines.length - 1) * lh + size / 2 + 3];
    if (placed.some(b => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1])) continue;

    ctx.beginPath(); ctx.arc(ox, oy, dot, 0, 6.2832); ctx.fillStyle = '#e8291c'; ctx.fill();
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(2, size * 0.22); ctx.strokeStyle = '#0c0c0c';
    lines.forEach((l, k) => ctx.strokeText(l, x, y0 + k * lh));

}
/* scale bar in the bottom-left corner of the map, clear of the city */

  const cellsPerMile = 1609.344 / (D.cellSizeM || 100);
  const miles = mass * cellsPerMile * 2 > MAPW * 0.25 ? 1 : 2;
  const len = mass * cellsPerMile * miles, x = BLEED + 22, y = BLEED + MAPH - 22;
  const fs = Math.max(12, Math.round(MAPH * 0.016));

  ctx.font = `500 ${fs}px system-ui,sans-serif`; ctx.fillStyle = 'rgba(255,255,255,.7)';
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';

}

/* ======================= panel ======================= */
const $ = id => document.getElementById(id);

// residents sparkline
const popMax = Math.max(...POP);
function drawSpark() {
  const c = $('spark'), r = c.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  if (c.width !== Math.round(r.width * dpr) || c.height !== Math.round(r.height * dpr)) { c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr); }
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);

  const X = k => k / (NF - 1) * (w - 2) + 1, Y = p => bot - p / (popMax * 1.08) * (bot - top);
  const fs = Math.max(10, Math.round(h * 0.085));
  g.font = `500 ${fs}px system-ui,sans-serif`; g.lineWidth = 1;
  g.strokeStyle = '#232321'; g.fillStyle = '#7f7d77'; g.textAlign = 'left'; g.textBaseline = 'bottom';
  for (const p of [100000, 200000]) { const yy = Math.round(Y(p)) + 0.5; g.beginPath(); g.moveTo(0, yy); g.lineTo(w, yy); g.stroke(); g.fillText(p / 1000 + 'k', 2, yy - 2); }
  g.beginPath(); POP.forEach((p, k) => k ? g.lineTo(X(k), Y(p)) : g.moveTo(X(k), Y(p)));
  g.strokeStyle = '#bfbeb6'; g.globalAlpha = 0.3; g.lineWidth = 1.5; g.stroke(); g.globalAlpha = 1;
  const kEnd = Math.min(NF - 1, t), i = Math.floor(kEnd), f = kEnd - i;
  const pNow = POP[i] + (POP[Math.min(i + 1, NF - 1)] - POP[i]) * f;
  g.beginPath(); g.moveTo(X(0), bot);
  for (let k = 0; k <= i; k++) g.lineTo(X(k), Y(POP[k]));
  g.lineTo(X(kEnd), Y(pNow)); g.lineTo(X(kEnd), bot); g.closePath();
  g.fillStyle = '#9aa07f'; g.globalAlpha = 0.18; g.fill(); g.globalAlpha = 1;
  g.beginPath(); for (let k = 0; k <= i; k++) k ? g.lineTo(X(k), Y(POP[k])) : g.moveTo(X(k), Y(POP[k]));
  g.lineTo(X(kEnd), Y(pNow)); g.strokeStyle = '#9aa07f'; g.lineWidth = Math.max(2, h * 0.018); g.stroke();
  g.beginPath(); g.arc(X(kEnd), Y(pNow), Math.max(3.5, h * 0.03), 0, 6.2832); g.fillStyle = '#fff'; g.fill();
  g.fillStyle = '#7f7d77'; g.textBaseline = 'top'; g.textAlign = 'left'; g.fillText(String(Y0), 1, bot + 3);
  g.textAlign = 'right'; g.fillText(String(Y1), w - 1, bot + 3);
}
// decade ticks under the scrubber
for (const y of YEARS) {
  if (y % 10 !== 0 && y !== Y1 && y !== Y0) continue;
  const s = document.createElement('span'); s.textContent = y;
  s.style.left = ((y - Y0) / (Y1 - Y0) * 100) + '%'; $('ticks').appendChild(s);
}

/* ======================= tooltip: subdivisions =======================
   Pointing at the map names the subdivision there, when most of its homes were
   built, roughly how many people lived in them then, and Chandler's population that
   year. Without subdivision data it falls back to the crowding at that spot. */
const tip = $('tip');
const SUBS = (D.subdivisions || []).map(sd => {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const r of sd.r) for (const [x, y] of r) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  return Object.assign({ bb: [x0, y0, x1, y1] }, sd);
});
function subAt(gx, gy) {
  let best = null, bestA = Infinity;
  for (const sd of SUBS) {
    const [x0, y0, x1, y1] = sd.bb;
    if (gx < x0 || gx > x1 || gy < y0 || gy > y1) continue;
    let c = false;
    for (const r of sd.r) for (let a = 0, b = r.length - 1; a < r.length; b = a++) {
      const [xa, ya] = r[a], [xb, yb] = r[b];
      if ((ya > gy) !== (yb > gy) && gx < (xb - xa) * (gy - ya) / (yb - ya) + xa) c = !c;
    }
    const area = (x1 - x0) * (y1 - y0);
    if (c && area < bestA) { best = sd; bestA = area; }       // the smallest one wins where plats overlap
  }
  return best;
}
let lastSub;
function outline(sd) {
  if (sd === lastSub) return; lastSub = sd;
  uctx.setTransform(1, 0, 0, 1, 0, 0); uctx.clearRect(0, 0, uv.width, uv.height);
  if (!sd) return;
  uctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const p = new Path2D();
  for (const r of sd.r) { r.forEach(([x, y], k) => { const X = x * mass + verX, Y = y * mass + verY; k ? p.lineTo(X, Y) : p.moveTo(X, Y); }); p.closePath(); }
  uctx.lineJoin = 'round';
  uctx.strokeStyle = 'rgba(12,12,12,.85)'; uctx.lineWidth = 3.5; uctx.stroke(p);
  uctx.strokeStyle = '#fff'; uctx.lineWidth = 1.5; uctx.stroke(p);
}
const yrs = sd => sd.y0 === sd.y1 ? String(sd.y0) : sd.y0 + '–' + sd.y1;
$('mapwrap').addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const gx = (mx - verX) / mass, gy = (my - verY) / mass, i = gx | 0, j = gy | 0;
  const inCity = i >= 0 && j >= 0 && i < W && j < H && INSIDE[j * W + i];
  const sd = SUBS.length ? subAt(gx, gy) : null;
  if (!inCity && !sd) { tip.style.opacity = 0; outline(null); return; }
  const y = YEARS[Math.min(NF - 1, Math.floor(t + 1e-6))];
  const crowd = inCity ? `×${RAW[j * W + i].toFixed(2)}` : '';
  let html;
  if (sd) {
    html = `<b>${sd.n}</b><dl>` + (sd.h
      ? `<dt>Built</dt><dd>${yrs(sd)}</dd>` +
        `<dt>Homes</dt><dd>${nf.format(sd.h)}</dd>` +
        `<dt>Residents when built</dt><dd>≈ ${nf.format(sd.p)}</dd>` +
        `<dt>Chandler in ${sd.ym}</dt><dd>≈ ${nf.format(Math.round(sd.c / 1000) * 1000)}</dd>`
      : `<dt>Built</dt><dd>before ${Y0} or not residential</dd>`) + '</dl>' +
      (crowd ? `<span class="sub">Crowding here in ${y}: ${crowd}</span>` : '');
  } else {
    const per = D.refDensityPerSqMi ? Math.round(RAW[j * W + i] * D.refDensityPerSqMi / 50) * 50 : null;
    html = `<b>${y}</b><dl><dt>Crowding</dt><dd>${crowd}</dd>` +
      (per !== null ? `<dt>People per sq mi</dt><dd>≈ ${nf.format(per)}</dd>` : '') + '</dl>';
  }
  tip.innerHTML = html;
  outline(sd);
  const tx = mx - BLEED, ty = my - BLEED;
  tip.style.left = Math.max(0, Math.min(MAPW - 290, tx + 14)) + 'px'; tip.style.top = Math.min(MAPH - 120, ty + 14) + 'px';
  tip.style.opacity = 1;
});
$('mapwrap').addEventListener('pointerleave', () => { tip.style.opacity = 0; outline(null); });

/* ======================= controls ======================= */
let speed = 1;
function setPlaying(p) {
  playing = p;
  $('play').innerHTML = p ? '❚❚ <span class="lbl">Pause</span>' : '▶ <span class="lbl">Play</span>';
  $('play').setAttribute('aria-label', p ? 'Pause' : 'Play');
  if (p && t >= NF - 1 - 1e-6) { t = 0; hold = 1.0; }
  lastTs = 0; poke();
}
$('play').onclick = () => setPlaying(!playing);
$('scrub').addEventListener('input', e => { setPlaying(false); t = e.target.value / 1000 * (NF - 1); dirty = true; });
$('speed').addEventListener('change', e => { speed = parseFloat(e.target.value); });
$('namen').addEventListener('click', e => { NAMES = !NAMES; e.currentTarget.setAttribute('aria-pressed', String(NAMES)); dirty = true; });
$('fullscreen').addEventListener('click', () => {
  document.fullscreenElement ? document.exitFullscreen().catch(() => {}) : document.documentElement.requestFullscreen().catch(() => {});
});
function chooseLadder(cvd) {
  setLadder(cvd ? HYPSO_CVD : HYPSO_ATLAS);
  $('farben').setAttribute('aria-pressed', String(cvd));
  try { localStorage.setItem('ladder', cvd ? 'cvd' : 'atlas'); } catch (e) {}
  legend(); dirty = true;
}
$('farben').addEventListener('click', () => chooseLadder(HYPSO !== HYPSO_CVD));
try { if (localStorage.getItem('ladder') === 'cvd') { setLadder(HYPSO_CVD); $('farben').setAttribute('aria-pressed', 'true'); } } catch (e) {}

addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'ArrowRight') { setPlaying(false); t = Math.min(NF - 1, Math.floor(t + 1e-6) + 1); dirty = true; }
  else if (e.key === 'ArrowLeft') { setPlaying(false); t = Math.max(0, Math.ceil(t - 1e-6) - 1); dirty = true; }
  else if (e.key === 'Home') { t = 0; dirty = true; }
  else if (e.key === 'End') { setPlaying(false); t = NF - 1; dirty = true; }
  else if (e.key === 'f' || e.key === 'F') $('fullscreen').click();
  else if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('kiosk');
  else if (/^[1-9]$/.test(e.key) && chapters[+e.key - 1]) { setPlaying(false); t = Math.max(0, YEARS.indexOf(chapters[+e.key - 1].from)); dirty = true; }
});
// the control bar fades out while playing and the pointer is idle
let idleTimer = null;
function poke() {
  document.body.classList.remove('idle'); clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (playing) document.body.classList.add('idle'); }, 3500);
}
for (const ev of ['pointermove', 'pointerdown', 'keydown']) addEventListener(ev, poke, { passive: true });
if (location.hash === '#kiosk') document.body.classList.add('kiosk');

/* ======================= loop ======================= */
let lastT = -1;
function frame(ts) {
  const dt = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0; lastTs = ts;
  if (playing) {
    if (hold > 0) {
      hold -= dt;
      if (hold <= 0 && t >= NF - 1 - 1e-6) { t = 0; hold = 1.0; dirty = true; }
    } else {
      t += dt * speed / SEC_PER_YEAR;
      if (t >= NF - 1) { t = NF - 1; hold = END_HOLD; }
      dirty = true;
    }
  }
  if (dirty || t !== lastT) { fieldAt(t); draw(); updatePanel(); lastT = t; dirty = false; }
  requestAnimationFrame(frame);
}
function relayout() { fitColumns(); masse(); drawSpark(); }
if (window.ResizeObserver) {
  let lw = 0, lh = 0;
  new ResizeObserver(() => {
    const f = cv.parentElement;
    if (f.clientWidth === lw && f.clientHeight === lh) return;
    lw = f.clientWidth; lh = f.clientHeight; masse();
  }).observe(cv.parentElement);
}
addEventListener('resize', relayout);
fitColumns(); masse(); legend(); setPlaying(playing);
requestAnimationFrame(frame);
})();
</script>
</body></html>
